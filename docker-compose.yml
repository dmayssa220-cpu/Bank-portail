services:
  postgres:
    image: postgres:16-alpine
    container_name: bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankdb}
      POSTGRES_USER: ${POSTGRES_USER:-bankuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankuser} -d ${POSTGRES_DB:-bankdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank-network

  backend:
    build:
      context: ./backend/BankApi
      dockerfile: Dockerfile
    container_name: bank-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-bankdb};Username=${POSTGRES_USER:-bankuser};Password=${POSTGRES_PASSWORD:-bankpassword}"
      FrontendOrigin: "http://localhost:3000"
      Jwt__Key: ${JWT_KEY:-dev-secret-key-change-me-in-production-please}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Odoo__Url: ${ODOO_URL:-http://odoo:8069}
      Odoo__Database: ${ODOO_DATABASE:-bankportal}
      Odoo__Username: ${ODOO_USERNAME:-admin}
      Odoo__Password: ${ODOO_API_PASSWORD:-admin}
      Ollama__Url: ${OLLAMA_URL:-http://ollama:11434}
      Ollama__Model: ${OLLAMA_MODEL:-llama3.2:1b}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Email__Host: ${EMAIL_HOST:-mailhog}
      Email__Port: ${EMAIL_PORT:-1025}
      Email__FromAddress: ${EMAIL_FROM:-notifications@mabanque.local}
      Redis__ConnectionString: ${REDIS_CONNECTION:-redis:6379}
    ports:
      - "5000:8080"
    networks:
      - bank-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bank-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - bank-network


  odoo-db:
    image: postgres:16-alpine
    container_name: bank-odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoopassword}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - bank-network

  odoo:
    image: odoo:17.0
    container_name: bank-odoo
    restart: unless-stopped
    depends_on:
      - odoo-db
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoopassword}
    ports:
      - "8069:8069"
    volumes:
      - odoo_web_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    networks:
      - bank-network


  ollama:
    image: ollama/ollama:latest
    container_name: bank-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - bank-network
    
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: bank-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"  
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - bank-network

  
  
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: bank-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" 
      - "8025:8025" 
    networks:
      - bank-network

 
  redis:
    image: redis:7-alpine
    container_name: bank-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bank-network

volumes:
  pgdata:
  odoo_db_data:
  odoo_web_data:
  odoo_addons:
  ollama_data:

networks:
  bank-network:
    driver: bridge
