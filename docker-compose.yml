services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bankdb}
      POSTGRES_USER: ${POSTGRES_USER:-bankuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankpassword}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bankuser} -d ${POSTGRES_DB:-bankdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - bank-network

  backend:
    build:
      context: ./backend/BankApi
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=postgres;Database=${POSTGRES_DB:-bankdb};Username=${POSTGRES_USER:-bankuser};Password=${POSTGRES_PASSWORD:-bankpassword}"
      FrontendOrigin: "http://localhost:3000"
      Jwt__Key: ${JWT_KEY:-dev-secret-key-change-me-in-production-please}
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Odoo__Url: ${ODOO_URL:-http://odoo:8069}
      Odoo__Database: ${ODOO_DATABASE:-bankportal}
      Odoo__Username: ${ODOO_USERNAME:-admin}
      Odoo__Password: ${ODOO_API_PASSWORD:-admin}
      Ollama__Url: ${OLLAMA_URL:-http://ollama:11434}
      Ollama__Model: ${OLLAMA_MODEL:-qwen2.5:0.5b}
      RabbitMq__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMq__Username: ${RABBITMQ_USER:-guest}
      RabbitMq__Password: ${RABBITMQ_PASSWORD:-guest}
      Email__Host: ${EMAIL_HOST:-mailhog}
      Email__Port: ${EMAIL_PORT:-1025}
      Email__FromAddress: ${EMAIL_FROM:-notifications@mabanque.local}
      Redis__ConnectionString: ${REDIS_CONNECTION:-redis:6379}
    ports:
      - "5000:8080"
    networks:
      - bank-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - bank-network

  # --- Odoo Community : ERP (CRM + Comptabilité) ---
  # Odoo a besoin de son propre utilisateur PostgreSQL avec le droit CREATEDB,
  # on lui dédie donc sa propre instance PostgreSQL (séparée de la base bancaire).
  odoo-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${ODOO_DB_USER:-odoo}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD:-odoopassword}
    volumes:
      - odoo_db_data:/var/lib/postgresql/data
    networks:
      - bank-network

  odoo:
    image: odoo:17.0
    restart: unless-stopped
    depends_on:
      - odoo-db
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER:-odoo}
      PASSWORD: ${ODOO_DB_PASSWORD:-odoopassword}
    ports:
      - "8069:8069"
    volumes:
      - odoo_web_data:/var/lib/odoo
      - odoo_addons:/mnt/extra-addons
    networks:
      - bank-network

  # --- Ollama : LLM local et 100% gratuit pour le chatbot ---
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_CONTEXT_LENGTH: 2048
      OLLAMA_NUM_PARALLEL: 1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - bank-network
    # Décommentez si vous avez un GPU NVIDIA compatible (accélère beaucoup les réponses) :
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # --- RabbitMQ : bus d'événements (architecture event-driven) ---
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "5672:5672"  
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - bank-network

  # --- MailHog : serveur SMTP factice gratuit, capture les emails localement ---
  # Aucune inscription nécessaire. Interface web : http://localhost:8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025" # port SMTP (utilisé par le backend)
      - "8025:8025" # interface web pour consulter les emails reçus
    networks:
      - bank-network

  # --- Redis : cache + jetons temporaires (ex: session 2FA en attente) ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - bank-network

volumes:
  pgdata:
  odoo_db_data:
  odoo_web_data:
  odoo_addons:
  ollama_data:
  rabbitmq_data:

networks:
  bank-network:
    driver: bridge
